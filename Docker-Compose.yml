version: '3.8'

services:
  # --- THE DATABASE ---
  db_nl2sql:
    image: mariadb:11.8.8 # Using the same version as your current setup
    container_name: nl2sql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: production_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password_change_me
    ports:
      # IMPORTANT: 3306 is already used by your Vikas database. 
      # We map 3307 on your computer to 3306 inside this container.
      - "3307:3306"
    volumes:
      - nl2sql_data:/var/lib/mysql
      - type: bind
        source: ./schema/schema.sql
        target: /docker-entrypoint-initdb.d/1-schema.sql
        read_only: true
      - type: bind
        source: ./schema/data.sql
        target: /docker-entrypoint-initdb.d/2-data.sql
        read_only: true
    networks:
      - nl2sql_net

  # --- THE PYTHON APP ---
  app:
    build: ./app
    container_name: nl2sql_app
    restart: unless-stopped
    volumes:
      # Mount the data folder so the app can read questions.jsonl
      - ./data:/app/data
    environment:
      # Point to the db_nl2sql service name
      DB_HOST: db_nl2sql
      DB_USER: app_user
      DB_PASSWORD: app_password_change_me
      DB_NAME: production_db
    depends_on:
      - db_nl2sql
    networks:
      - nl2sql_net

# Isolated volume and network
volumes:
  nl2sql_data:

networks:
  nl2sql_net:
    driver: bridge