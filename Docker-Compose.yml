version: '3.8'

services:
  # --- THE DATABASE ---
  db_nl2sql:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: nl2sql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: production_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password_change_me
    ports:
      - "3307:3306"
    volumes:
      # Only keep the persistent data volume here
      - nl2sql_data:/var/lib/mysql
    networks:
      - nl2sql_net

  # --- THE PYTHON APP ---
  app:
    build: ./app
    container_name: nl2sql_app
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      DB_HOST: db_nl2sql
      DB_USER: app_user
      DB_PASSWORD: app_password_change_me
      DB_NAME: production_db
    depends_on:
      - db_nl2sql
    networks:
      - nl2sql_net

# Isolated volume and network
volumes:
  nl2sql_data:

networks:
  nl2sql_net:
    driver: bridge