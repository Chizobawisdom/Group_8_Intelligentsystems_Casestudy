services:
  db:
    image: mariadb:11.8
    container_name: nl2sql_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: nlp2sql
      MARIADB_DATABASE: nlp2sql
      MARIADB_USER: nlp2sql
      MARIADB_PASSWORD: nlp2sql
    ports:
      - "3307:3306"
    volumes:
      - nl2sql_data:/var/lib/mysql
      # Init scripts run alphabetically, only on the first start (empty volume)
      - ./data/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/schema/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s
    networks:
      - nl2sql_net

  app:
    build: ./app
    container_name: nl2sql_app
    restart: "no"
    environment:
      DB_HOST: db
      DB_USER: nlp2sql
      DB_PASSWORD: nlp2sql
      DB_NAME: nlp2sql
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nl2sql_net

volumes:
  nl2sql_data:

networks:
  nl2sql_net: